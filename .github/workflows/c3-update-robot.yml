name: StackOS C3 update robot - 6h audit
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: stackos-c3-update-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit TLS, APT index and Mesa packages
        id: audit
        continue-on-error: true
        run: |
          python3 tools/c3-update-robot/audit.py | tee "$RUNNER_TEMP/stackos-audit.json"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Open or update diagnostic issue on failure
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="[C3 robot] APT/TLS/Mesa audit failed"
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "[C3 robot] APT/TLS/Mesa audit failed") | .number' | head -1)
          {
            echo "Scheduled StackOS C3 read-only audit failed."
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '~~~json'
            cat "$RUNNER_TEMP/stackos-audit.json"
            echo '~~~'
            echo
            echo "No packages were built, signed, installed or published."
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Fail job if audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
