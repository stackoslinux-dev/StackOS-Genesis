[Unit]
# Run image-based updates only after a transfer channel has been configured.
ConditionPathExistsGlob=|/etc/sysupdate.d/*.transfer
ConditionPathExistsGlob=|/run/sysupdate.d/*.transfer
ConditionPathExistsGlob=|/usr/local/lib/sysupdate.d/*.transfer
ConditionPathExistsGlob=|/usr/lib/sysupdate.d/*.transfer
